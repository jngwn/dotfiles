# ~/.config/foot/foot.ini

[main]
# Prefer broadly available terminfo on SSH hosts over Foot-specific capabilities.
term=xterm-256color
font=CommitMono Nerd Font Mono:size=14
font-bold=CommitMono Nerd Font Mono:weight=bold:size=14
# Italic terminal attributes stay upright to match the maintained text style.
font-italic=CommitMono Nerd Font Mono:size=14
font-bold-italic=CommitMono Nerd Font Mono:weight=bold:size=14
box-drawings-uses-font-glyphs=no
pad=0x0 center
initial-color-theme=light
# Keep application content out of always-visible window titles.
locked-title=yes
bold-text-in-bright=no

[scrollback]
lines=10000
multiplier=5.0
indicator-position=none

[security]
# Remote applications may copy outward through OSC 52 but cannot read the host clipboard.
osc52=copy-enabled

[bell]
system=no
urgent=no
notify=no
visual=no

[colors-light]
# docs/color_system.md owns these semantic Paper and ANSI mappings.
background=f2eede
foreground=000000
alpha=1.0
blur=no
cursor=f2eede 000000
selection-foreground=000000
selection-background=b7c9dc
regular0=000000
regular1=cc3e28
regular2=216609
regular3=b58900
regular4=1e6fcc
regular5=5c21a5
regular6=158c86
regular7=aaaaaa
bright0=555555
bright1=cc3e28
bright2=216609
bright3=b58900
bright4=1e6fcc
bright5=5c21a5
bright6=158c86
bright7=aaaaaa

[csd]
preferred=server
