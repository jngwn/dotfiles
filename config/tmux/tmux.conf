unbind C-b
set -g prefix `
bind ` last-window
bind e send-prefix
set -g mouse on
set -g allow-rename off
set -g automatic-rename off
set -s set-clipboard on

if-shell 'infocmp tmux-256color >/dev/null 2>&1' {
  set-option -g default-terminal "tmux-256color"
} {
  set-option -g default-terminal "screen-256color"
}
set-option -ga terminal-overrides ",*256col*:RGB"

if-shell '[ "$TERM" != "screen" ] && \
    [ "$TERM" != "tmux" ] && \
    [ "$TERM" != "linux" ]' {
      set-environment -g COLORTERM "truecolor"
    }

set -g status-position bottom
set -g status-style fg=#000000,bg=#c8c3b3
set -g status-left ''
set -g status-right ''
set -g status-right-length 0
set -g status-left-length 0
setw -g mode-keys vi

setw -g window-status-current-style fg=#000000,bg=#b8ad94,bold
setw -g window-status-style fg=#303030,bg=#c8c3b3
setw -g window-status-current-format ' #I:#{?@marked,#[underscore]#W#[nounderscore],#W}#F '
setw -g window-status-format ' #I:#{?@marked,#[underscore]#W#[nounderscore],#W}#F '
set -g message-style fg=#000000,bg=#ffd400,bold
set -g mode-style fg=#000000,bg=#b7c9dc

set -g history-limit 10000
set -g status-interval 5

set -s escape-time 0
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'V' send -X select-line
bind -T copy-mode-vi 'r' send -X rectangle-toggle
# Local providers override this terminal clipboard path when available.
bind -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection \; send -X clear-selection

if-shell '[ -z "$SSH_CONNECTION" ] && [ -z "$SSH_TTY" ] && \
    [ -n "$DISPLAY" ] && command -v xsel >/dev/null 2>&1' {
  bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xsel --clipboard --input'
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe 'xsel --clipboard --input' \; send -X clear-selection
}

if-shell '[ -z "$SSH_CONNECTION" ] && [ -z "$SSH_TTY" ] && \
    [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1' {
  bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe 'xclip -selection clipboard -in' \; send -X clear-selection
}

if-shell '[ -z "$SSH_CONNECTION" ] && [ -z "$SSH_TTY" ] && \
    [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1' {
  bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'wl-copy'
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe 'wl-copy' \; send -X clear-selection
}

if-shell '[ -z "$SSH_CONNECTION" ] && [ -z "$SSH_TTY" ] && \
    command -v pbcopy >/dev/null 2>&1' {
  bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe 'pbcopy' \; send -X clear-selection
}

# Direct clip.exe piping can misdecode tmux's UTF-8 stream, so WSL uses terminal integration.
if-shell 'test -r /proc/sys/kernel/osrelease && \
    grep -qiE "(microsoft|wsl)" /proc/sys/kernel/osrelease' {
  bind -T copy-mode-vi 'y' send -X copy-selection-and-cancel
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection \; send -X clear-selection
}

bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

bind m set -wF @marked '#{?@marked,,1}' \; display-message 'window mark #{?@marked,on,off}'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r S-Left resize-pane -L 2
bind -r S-Right resize-pane -R 2
bind -r S-Up resize-pane -U 2
bind -r S-Down resize-pane -D 2

bind-key y set-window-option synchronize-panes

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
# Keep general output quiet, but retain an explicit BEL from a background task
# as a passive status-line flag. bell-action=none prevents sound or a popup.
setw -g monitor-bell on
setw -g window-status-bell-style fg=#000000,bg=#b7c9dc
set -g bell-action none
