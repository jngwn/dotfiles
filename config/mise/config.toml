[settings]
use_versions_host_track = false

[tools]
node = "lts"
java = "temurin-21"
rust = { version = "latest", profile = "minimal", components = [
  "clippy",
  "rust-analyzer",
  "rust-src",
  "rustfmt",
] }
uv = "latest"
"pypi:ruff" = { version = "latest", depends = "uv" }
"pypi:ty" = { version = "latest", depends = "uv" }
"aqua:biomejs/biome" = "latest"
"github:yt-dlp/yt-dlp-nightly-builds" = { version = "latest", bin = "yt-dlp", prerelease = true }
"aqua:openai/codex" = "latest"
