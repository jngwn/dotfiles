[Resolve]
# Do not silently select systemd's compiled-in public resolvers when a
# connection supplies no DNS server. NetworkManager connection profiles own
# both the resolver endpoint and any strict DNS-over-TLS policy.
FallbackDNS=
# Keep compatibility as the system default. Personal connection profiles can
# request strict DNS-over-TLS, while captive-portal, company, and VPN profiles
# can retain their required DNS behavior.
DNSOverTLS=no
